  <script>
    // Aplica el tema y el idioma antes de pintar la página, para que no parpadee.
    try {
      const a = JSON.parse(localStorage.getItem('idiomas-ajustes') ?? localStorage.getItem('espanol-ajustes')) || {};
      const t = a.tema || 'auto';
      const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      const compatibles = new Set(['en', 'vi']);
      const detectar = () => [...(navigator.languages ?? []), navigator.language ?? '']
        .map(x => x.toLowerCase().replaceAll('_', '-').split('-')[0]).find(x => compatibles.has(x)) ?? 'en';
      document.documentElement.lang = a.idioma && a.idioma !== 'auto' && compatibles.has(a.idioma) ? a.idioma : detectar();
      // los textos de ese idioma se piden ya, a la vez que el resto de la app (js/i18n.js solo carga el idioma en uso)
      if (document.documentElement.lang !== 'en') {
        const l = document.createElement('link');
        l.rel = 'modulepreload';
        l.href = 'js/i18n/' + document.documentElement.lang + '.js?v=__VERSION__';
        document.head.append(l);
      }
    } catch (e) { /* tema por defecto */ }
  </script>

    </a>

      </span>
      <button type="button" id="btn-sonido" class="btn btn-icono" aria-pressed="true" aria-label="Mute sounds">♪</button>
      <button type="button" id="btn-tema" class="btn btn-icono" aria-label="Switch to dark mode">☾</button>
    </span>
    </div>
    <div id="cabecera-cinta" class="cabecera-cinta" hidden></div>
  </header>

  <main id="app" tabindex="-1">
    <div class="arranque">
      <img class="arranque-logo" src="assets/logo.svg" alt="" width="128" height="128">
      <p class="arranque-nombre">Pa<span>glot</span></p>
    </div>
  </main>

  <footer id="pie-sitio" class="pie-sitio">
    <div class="pie-escena">
      <div class="pie-tutoras" data-pie-tutoras="izq" aria-hidden="true"></div>

        <img class="pie-logo" src="assets/logo.svg" alt="" width="160" height="160">
        <span class="pie-nombre" aria-hidden="true">Pa<span>glot</span></span>
        <small class="pie-lema" data-pie-lema>Learn at your own pace</small>
      </a>
      <div class="pie-tutoras" data-pie-tutoras="der" aria-hidden="true"></div>
    </div>
    <div class="pie-suelo" aria-hidden="true"></div>
    <div class="pie-interior">
      <nav class="pie-grupos" aria-label="Paglot">
        <section class="pie-grupo">
          <h2 data-pie-titulo="ayuda">Help</h2>
          <a href="#/bienvenida" data-pie="bienvenida" hidden>See the welcome again</a>
          <a href="#/creditos" data-pie="creditos">Credits</a>
        </section>
      </nav>
    </div>
    <div class="pie-base">
      <div class="pie-base-interior">
        <span class="pie-anio" data-pie-anio>© Paglot</span>
        <span class="pie-firma" data-pie-final>Aprender, a tu ritmo.</span>
        <button type="button" class="pie-subir" data-pie-subir>▲</button>
      </div>
    </div>
  </footer>

  <aside id="tutora" class="tutora" data-t-aria="tutora.nombre">
    <div class="tutora-dialogo">
      <p class="tutora-nombre" data-t="tutora.nombrePropio">Tutor</p>
      <p class="tutora-texto" aria-hidden="true"></p>
      <p class="solo-lector" aria-live="polite"></p>
      <div class="tutora-botones">
        <button type="button" class="boton boton-mini tutora-siguiente" data-t="tutora.siguiente" hidden>Next ▶</button>
        <button type="button" class="boton boton-mini tutora-ocultar" aria-expanded="true">Hide ▼</button>
      </div>
    </div>
    <button type="button" class="tutora-retrato" data-t-aria="tutora.tocar" data-t-title="tutora.tocame">
      <canvas class="tutora-canvas" width="48" height="60" role="img"></canvas>
    </button>
  </aside>
