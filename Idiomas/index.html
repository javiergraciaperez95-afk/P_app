<!doctype html>
<html lang="en" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Idiomas</title>
  <meta name="description" content="Language courses with a pixel-art tutor · Cursos de idiomas con una tutora en pixel art.">
  <meta name="theme-color" content="#14111c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Aplica el tema y el idioma antes de pintar la página, para que no parpadee.
    try {
      const a = JSON.parse(localStorage.getItem('idiomas-ajustes') ?? localStorage.getItem('espanol-ajustes')) || {};
      const t = a.tema || 'auto';
      const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      if (a.idioma) document.documentElement.lang = a.idioma;
    } catch (e) { /* tema por defecto */ }
  </script>
  <link rel="stylesheet" href="css/fuentes.css?v=__VERSION__">
  <link rel="stylesheet" href="css/styles.css?v=__VERSION__&h=3">
  <!-- Al publicar, __VERSION__ se cambia por el código de la versión (ver .github/workflows/static.yml),
       así el navegador descarga siempre los archivos nuevos en lugar de usar los antiguos guardados. -->
  <script type="importmap">
    {
      "imports": {
        "./js/ajustes.js": "./js/ajustes.js?v=__VERSION__",
        "./js/app.js": "./js/app.js?v=__VERSION__",
        "./js/comunes.js": "./js/comunes.js?v=__VERSION__",
        "./js/config.js": "./js/config.js?v=__VERSION__",
        "./js/creditos.js": "./js/creditos.js?v=__VERSION__",
        "./js/curso.js": "./js/curso.js?v=__VERSION__",
        "./js/cursos.js": "./js/cursos.js?v=__VERSION__",
        "./js/dom.js": "./js/dom.js?v=__VERSION__",
        "./js/exercises.js": "./js/exercises.js?v=__VERSION__",
        "./js/i18n.js": "./js/i18n.js?v=__VERSION__",
        "./js/i18n/en.js": "./js/i18n/en.js?v=__VERSION__",
        "./js/i18n/es.js": "./js/i18n/es.js?v=__VERSION__",
        "./js/i18n/vi.js": "./js/i18n/vi.js?v=__VERSION__",
        "./js/i18n/zh.js": "./js/i18n/zh.js?v=__VERSION__",
        "./js/iconos.js": "./js/iconos.js?v=__VERSION__",
        "./js/juego/efectos.js": "./js/juego/efectos.js?v=__VERSION__",
        "./js/juego/escenas.js": "./js/juego/escenas.js?v=__VERSION__",
        "./js/juego/escenas-b.js": "./js/juego/escenas-b.js?v=__VERSION__",
        "./js/juego/escenas-c.js": "./js/juego/escenas-c.js?v=__VERSION__",
        "./js/juego/motor.js": "./js/juego/motor.js?v=__VERSION__",
        "./js/lessons.js": "./js/lessons.js?v=__VERSION__",
        "./js/movil.js": "./js/movil.js?v=__VERSION__",
        "./js/progress.js": "./js/progress.js?v=__VERSION__",
        "./js/sonidos.js": "./js/sonidos.js?v=__VERSION__",
        "./js/srs.js": "./js/srs.js?v=__VERSION__",
        "./js/sync.js": "./js/sync.js?v=__VERSION__",
        "./js/tutor-sprite.js": "./js/tutor-sprite.js?v=__VERSION__",
        "./js/tutor.js": "./js/tutor.js?v=__VERSION__",
        "./js/tutora-base.js": "./js/tutora-base.js?v=__VERSION__",
        "./js/vistas/cuaderno.js": "./js/vistas/cuaderno.js?v=__VERSION__",
        "./js/vistas/cursos.js": "./js/vistas/cursos.js?v=__VERSION__",
        "./js/vistas/frases.js": "./js/vistas/frases.js?v=__VERSION__",
        "./js/vistas/leccion.js": "./js/vistas/leccion.js?v=__VERSION__",
        "./js/vistas/lecciones.js": "./js/vistas/lecciones.js?v=__VERSION__",
        "./js/vistas/perfil.js": "./js/vistas/perfil.js?v=__VERSION__",
        "./js/vistas/practica.js": "./js/vistas/practica.js?v=__VERSION__",
        "./js/vistas/repaso.js": "./js/vistas/repaso.js?v=__VERSION__"
      }
    }
  </script>
  <script type="module" src="js/app.js?v=__VERSION__"></script>
  <script>
    // App instalable: guarda copia para funcionar sin conexión. En el ordenador (localhost) no se activa.
    if ('serviceWorker' in navigator && !['localhost', '127.0.0.1'].includes(location.hostname)) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</head>
<body>
  <a class="saltar" href="#app" data-t="html.saltar">Skip to content</a>

  <header class="cabecera">
    <a href="#/lecciones" class="marca"><span class="marca-titulo"><span id="marca-nombre"></span> <span id="marca-bandera"></span></span> <small id="marca-subtitulo"></small></a>
    <span class="cabecera-botones">
      <a id="btn-curso" class="btn btn-icono btn-curso" href="#/idiomas" hidden>⇄</a>
      <select id="sel-idioma" class="btn sel-idioma" aria-label="Language" data-t-aria="idioma.selector"></select>
      <button type="button" id="btn-sonido" class="btn btn-icono" aria-pressed="true" aria-label="Mute sounds">♪</button>
      <button type="button" id="btn-tema" class="btn btn-icono" aria-label="Switch to dark mode">☾</button>
    </span>
  </header>

  <nav id="menu" class="menu" data-t-aria="html.secciones"></nav>

  <main id="app" tabindex="-1">
    <p class="cargando" data-t="html.cargando">Loading…</p>
  </main>

  <aside id="tutora" class="tutora" data-t-aria="tutora.nombre">
    <div class="tutora-dialogo">
      <p class="tutora-nombre" data-t="tutora.nombre">Tutor</p>
      <p class="tutora-texto" aria-hidden="true"></p>
      <p class="solo-lector" aria-live="polite"></p>
      <div class="tutora-botones">
        <button type="button" class="boton boton-mini tutora-siguiente" data-t="tutora.siguiente" hidden>Next ▶</button>
        <button type="button" class="boton boton-mini tutora-ocultar" aria-expanded="true">Hide ▼</button>
      </div>
    </div>
    <button type="button" class="tutora-retrato" data-t-aria="tutora.tocar" data-t-title="tutora.tocame">
      <canvas class="tutora-canvas" width="48" height="60" role="img"></canvas>
    </button>
  </aside>

  <div id="ficha-palabra" class="ficha-palabra" role="dialog" data-t-aria="ficha.titulo" hidden></div>
</body>
</html>
