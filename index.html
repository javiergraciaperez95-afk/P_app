  <script>
    // Aplica el tema, la comodidad y el idioma antes de pintar la página, para que no parpadee.
    try {
      const a = JSON.parse(localStorage.getItem('phuong-ajustes')) || {};
      const t = a.tema || 'auto';
      const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      const calma = typeof a.calma === 'boolean' ? a.calma : matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.documentElement.classList.toggle('modo-calma', calma);
      document.documentElement.classList.toggle('texto-grande', a.texto === 'grande');
      const movil = (navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'vi';
      document.documentElement.lang = a.idioma === 'es' || a.idioma === 'vi' ? a.idioma : a.idioma === 'auto' ? movil : 'vi';
    } catch (e) { /* tema por defecto */ }
  </script>

  <script>
    // Si la app no llega a pintar nada (un archivo que no llega, un navegador demasiado antiguo), en vez de quedarse
    // en el logotipo para siempre se dice qué pasa y se ofrece volver a intentarlo.
    (() => {
      const TEXTOS = {
        vi: ['Đang lâu hơn bình thường. Nếu không mở được, hãy thử lại.', 'Thử lại'],
        es: ['Está tardando más de lo normal. Si no se abre, vuelve a intentarlo.', 'Volver a intentarlo'],
      };
      addEventListener('DOMContentLoaded', () => setTimeout(() => {
        const caja = document.querySelector('.arranque');
        if (!document.body.classList.contains('arrancando') || !caja || caja.querySelector('.arranque-fallo')) return;
        const [lento, boton] = TEXTOS[document.documentElement.lang] || TEXTOS.vi;
        const p = document.createElement('p');
        p.className = 'arranque-fallo';
        p.textContent = lento;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'boton';
        b.textContent = boton;
        b.addEventListener('click', () => location.reload());
        caja.append(p, b);
      }, 15000));
    })();
  </script>

<!-- «arrancando»: mientras carga la app solo se ve el logotipo; la clase se quita al pintar la primera pantalla (js/app.js). -->
