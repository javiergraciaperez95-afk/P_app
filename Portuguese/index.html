<!doctype html>
<html lang="en" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olá! · Learn Portuguese</title>
  <meta name="description" content="Interactive European Portuguese course for English and Vietnamese speakers, with a pixel-art tutor." data-i18n-content="app.description">
  <meta name="theme-color" content="#121a16">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script>
    // Aplica el tema y el idioma de la interfaz antes de pintar la página, para que no parpadee.
    try {
      const t = (JSON.parse(localStorage.getItem('ola-ajustes')) || {}).tema || 'auto';
      const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      const idioma = localStorage.getItem('ola-idioma');
      if (idioma === 'en' || idioma === 'vi') document.documentElement.lang = idioma;
    } catch (e) { /* valores por defecto */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&family=Tiny5&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=__VERSION__&h=3">
  <!-- Al compilar (npm run build), __VERSION__ se cambia por el código de la versión,
       así el navegador descarga siempre los archivos nuevos en lugar de usar los antiguos guardados.
       Si añades un archivo JavaScript nuevo, añádelo también a esta lista. -->
  <script type="importmap">
    {
      "imports": {
        "./js/ajustes.js": "./js/ajustes.js?v=__VERSION__",
        "./js/app.js": "./js/app.js?v=__VERSION__",
        "./js/comunes.js": "./js/comunes.js?v=__VERSION__",
        "./js/config.js": "./js/config.js?v=__VERSION__",
        "./js/dom.js": "./js/dom.js?v=__VERSION__",
        "./js/exercises.js": "./js/exercises.js?v=__VERSION__",
        "./js/filas.js": "./js/filas.js?v=__VERSION__",
        "./js/i18n.js": "./js/i18n.js?v=__VERSION__",
        "./js/iconos.js": "./js/iconos.js?v=__VERSION__",
        "./js/lessons.js": "./js/lessons.js?v=__VERSION__",
        "./js/progress.js": "./js/progress.js?v=__VERSION__",
        "./js/sonidos.js": "./js/sonidos.js?v=__VERSION__",
        "./js/srs.js": "./js/srs.js?v=__VERSION__",
        "./js/sync.js": "./js/sync.js?v=__VERSION__",
        "./js/tutor-sprite.js": "./js/tutor-sprite.js?v=__VERSION__",
        "./js/tutor.js": "./js/tutor.js?v=__VERSION__",
        "./js/vistas/cuaderno.js": "./js/vistas/cuaderno.js?v=__VERSION__",
        "./js/vistas/frases.js": "./js/vistas/frases.js?v=__VERSION__",
        "./js/vistas/leccion.js": "./js/vistas/leccion.js?v=__VERSION__",
        "./js/vistas/lecciones.js": "./js/vistas/lecciones.js?v=__VERSION__",
        "./js/vistas/perfil.js": "./js/vistas/perfil.js?v=__VERSION__",
        "./js/vistas/practica.js": "./js/vistas/practica.js?v=__VERSION__",
        "./js/vistas/repaso.js": "./js/vistas/repaso.js?v=__VERSION__"
      }
    }
  </script>
  <script type="module" src="js/app.js?v=__VERSION__"></script>
</head>
<body>
  <a class="saltar" href="#app" data-i18n="header.skip">Skip to content</a>

  <header class="cabecera">
    <a href="#/lecciones" class="marca"><span class="marca-titulo"><span lang="pt-PT">Olá!</span> <svg class="bandera" width="21" height="14" viewBox="0 0 30 20" aria-hidden="true"><rect width="12" height="20" fill="#046a38"/><rect x="12" width="18" height="20" fill="#da291c"/><circle cx="12" cy="10" r="4.2" fill="#ffe900"/><circle cx="12" cy="10" r="2.6" fill="none" stroke="#046a38" stroke-width="0.8"/></svg></span> <small data-i18n="app.tagline">Learn Portuguese</small></a>
    <span class="cabecera-botones">
      <button type="button" id="btn-sonido" class="btn btn-icono" aria-pressed="true" aria-label="Mute sounds">♪</button>
      <button type="button" id="btn-tema" class="btn btn-icono" aria-label="Switch to dark mode">☾</button>
    </span>
  </header>

  <nav id="menu" class="menu" aria-label="Sections"></nav>

  <main id="app" tabindex="-1">
    <p class="cargando">Loading… / Đang tải…</p>
  </main>

  <aside id="tutora" class="tutora" aria-label="Tutor" data-i18n-aria-label="tutor.name">
    <div class="tutora-dialogo">
      <p class="tutora-nombre" data-i18n="tutor.title">Your tutor</p>
      <p class="tutora-texto" aria-hidden="true"></p>
      <p class="solo-lector" aria-live="polite"></p>
      <div class="tutora-botones">
        <button type="button" class="boton boton-mini tutora-siguiente" hidden><span data-i18n="tutor.next">Next</span> ▶</button>
        <button type="button" class="boton boton-mini tutora-ocultar" aria-expanded="true">Hide ▼</button>
      </div>
    </div>
    <button type="button" class="tutora-retrato" aria-label="Touch the tutor" data-i18n-aria-label="tutor.touch" data-i18n-title="tutor.touchMe" title="Touch me">
      <canvas class="tutora-canvas" width="48" height="62" role="img" aria-label="Tutor"></canvas>
    </button>
  </aside>

  <div id="ficha-palabra" class="ficha-palabra" role="dialog" aria-label="Word card" hidden></div>
</body>
</html>
