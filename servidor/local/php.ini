; PHP para la API, con los mismos ajustes de seguridad que tendrá el servidor (plan, sección 4).
; En el ordenador lo usan local/arrancar.sh y local/probar.sh. La carpeta de extensiones y
; open_basedir se pasan desde esos scripts, porque dependen de dónde esté el proyecto.

[PHP]
engine = On
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; Las trazas de error no llevan los valores de los argumentos: así nunca sale una contraseña en un registro.
zend.exception_ignore_args = On
html_errors = Off

allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,dl
file_uploads = Off
enable_dl = Off

max_execution_time = 10
max_input_time = 10
memory_limit = 128M
post_max_size = 3M
upload_max_filesize = 1M
max_input_vars = 100
default_charset = "UTF-8"
variables_order = "EGPCS"
request_order = "GP"
cgi.fix_pathinfo = 0

[Date]
date.timezone = UTC

[mbstring]
mbstring.language = neutral

extension = curl
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_mysql
extension = sodium
