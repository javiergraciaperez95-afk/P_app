<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK · 阅读小屋</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&family=Tiny5&family=Pixelify+Sans:wght@500;600;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Tema claro/oscuro antes de pintar, para que no parpadee
  (function () {
    var t = null;
    try { t = localStorage.getItem('hsk.tema'); } catch (e) {}
    if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
    document.documentElement.setAttribute('data-theme', t === 'claro' ? 'light' : 'dark');
  })();
</script>
<link rel="stylesheet" href="css/style.css?h=3">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">
  <header class="cabecera">
    <a href="#/" class="marca"><span class="marca-titulo"><span lang="zh">中文</span> <svg class="bandera" width="21" height="14" viewBox="0 0 30 20" aria-hidden="true" shape-rendering="crispEdges"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><path d="M5 2h1v2h2v1h-1v1h1v1h-2v-1h-1v1h-2v-1h1v-1h-1v-1h2z"/><rect x="10" y="1" width="1" height="1"/><rect x="9" y="2" width="3" height="1"/><rect x="12" y="3" width="1" height="1"/><rect x="11" y="4" width="3" height="1"/><rect x="12" y="6" width="1" height="1"/><rect x="11" y="7" width="3" height="1"/><rect x="10" y="9" width="1" height="1"/><rect x="9" y="10" width="3" height="1"/></g></svg></span> <small>读书小屋</small></a>
    <span class="cabecera-botones">
      <button type="button" id="btn-sonido" class="btn btn-icono" aria-pressed="true" aria-label="Sonido">♪</button>
      <button type="button" id="btn-tema" class="btn btn-icono" aria-label="Cambiar a modo oscuro">☾</button>
    </span>
  </header>

  <main class="reading">
    <div class="tab" id="tab">TEXTO</div>
    <div class="pantalla-bar">
      <button class="back" id="back" hidden aria-label="Volver atrás" title="Volver atrás">◂</button>
      <span class="badge" id="badge">HSK</span>
      <h1 id="heading">阅读理解 · 读书小屋</h1>
      <div class="hud">
        <div class="score" id="score"></div>
        <button class="reset" id="reset" hidden title="Reiniciar ejercicio" aria-label="Reiniciar ejercicio">↺</button>
      </div>
    </div>
    <div class="scroll" id="scroll">
      <div id="reading"></div>
    </div>
  </main>

  <section class="stage">
    <div class="dlg" id="dlg">
      <div class="nameplate">TUTORA<span>绿老师</span></div>
      <div class="dlg-body" id="dlgBody" aria-live="polite"></div>
    </div>
    <div class="girl" id="girlBtn" role="button" tabindex="0" aria-label="Tutora (pulsa para que hable)">
      <canvas id="girl" width="48" height="56"></canvas>
    </div>
  </section>
</div>
</body>
</html>
